# ============================================================
# 长夜余火 · emberspeech.com 反向代理配置（腾讯云 Ubuntu 服务器）
# ------------------------------------------------------------
# 作用：让用户用 https://emberspeech.com 访问，而不是 http://IP:3000
#
# 在【域名实名通过 + ICP备案通过】之后，于服务器上执行：
#   1) 安装：  sudo apt update && sudo apt install -y nginx certbot python3-certbot-nginx
#   2) 放配置：sudo cp deploy/nginx-emberspeech.conf /etc/nginx/sites-available/emberspeech.conf
#              sudo ln -sf /etc/nginx/sites-available/emberspeech.conf /etc/nginx/sites-enabled/
#   3) 先让 80 端口能通（certbot 申请证书的前提）：
#              sudo nginx -t && sudo systemctl reload nginx
#   4) 申请免费 HTTPS 证书（会自动改写本文件加上 443 + http跳转）：
#              sudo certbot --nginx -d emberspeech.com -d www.emberspeech.com
#   5) 把 docker-compose.yml 的 ports 改成 "127.0.0.1:3000:3000"（只听本地，强制走 nginx），
#              再 sudo docker compose up -d 重启容器。
#   6) 自动续期已随 certbot 安装好，可用 `sudo certbot renew --dry-run` 验证。
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name emberspeech.com www.emberspeech.com;

    # certbot 申请证书时的临时校验目录（勿删）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 所有流量反代到本机 3000 端口的 Docker 容器
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}

# 以下 443 段由第 4 步 certbot 自动生成，无需手写。
