# 长夜余火 · 腾讯云轻量应用服务器部署
# 用法：在服务器上 `docker compose up -d --build`
# 真实密钥放在同目录 .env.prod（不进仓库），由 env_file 注入
services:
  yuhuo:
    build: .
    image: yuhuo-liusheng:latest
    container_name: yuhuo
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.prod
    volumes:
      # 数据库与上传文件落盘到宿主机，容器重建也不丢
      - /opt/yuhuo-data:/app/data
      - /opt/yuhuo-uploads:/app/uploads
    environment:
      # 端口由平台注入，这里兜底
      - PORT=3000
