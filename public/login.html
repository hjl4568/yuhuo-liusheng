<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>登录 — 余火·留声</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-container">
    <div class="hero" style="padding:38px 24px 26px;">
      <img class="hero-mark" src="/brand-mark.svg" alt="长夜余火">
      <h2 style="font-size:22px;">欢迎回来</h2>
      <p>登录你的余火·留声账户</p>
      <div class="hero-trust"><span>隐私优先</span><i></i><span>端到端加密</span><i></i><span>主动送达</span></div>
    </div>

    <div class="page">
      <div class="card">
        <form id="login-form">
          <div class="form-group">
            <label class="form-label">手机号 <span class="required">*</span></label>
            <input type="tel" class="form-input" id="phone" placeholder="请输入手机号" required>
          </div>
          <div class="form-group">
            <label class="form-label">密码 <span class="required">*</span></label>
            <input type="password" class="form-input" id="password" placeholder="请输入密码" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block">登录</button>
        </form>
        <div style="text-align:center;margin-top:16px;font-size:14px;">
          还没有账号？<a href="/register.html">立即注册</a>
        </div>
      </div>

      <div style="text-align:center;padding:12px;">
        <a href="/app.html" style="font-size:13px;color:var(--text-light);">← 返回首页</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      try {
        const data = await request('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ phone, password }),
        });
        setToken(data.token);
        showToast('登录成功');
        setTimeout(() => { window.location.href = '/app.html'; }, 1000);
      } catch (err) {
        showToast(err.message);
      }
    });
  </script>
  <script src="/js/i18n-data.js"></script>
  <script src="/js/i18n.js"></script>
</body>
</html>
