<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后台管理 — 余火·留声</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css?v=20260806">
  <link rel="stylesheet" href="/css/nightfire.css?v=20260806">
  <style>
    .admin-container { max-width: 900px; margin: 0 auto; padding: 20px; }
    .admin-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; }
    .admin-tabs button { white-space: nowrap; padding: 8px 16px; border: 1px solid var(--border); background: #fff; border-radius: 8px; cursor: pointer; font-size: 14px; }
    .admin-tabs button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .table-wrapper { overflow-x: auto; background: #fff; border-radius: 12px; box-shadow: var(--shadow); }
    .admin-table tbody tr { cursor: pointer; transition: background .15s; }
    .admin-table tbody tr:hover { background: #F3F4F6; }
    /* 搜索栏 */
    .admin-toolbar { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
    .admin-toolbar input { flex: 1; min-width: 180px; padding: 8px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }
    .admin-toolbar .btn { white-space: nowrap; }
    /* 统计标签 */
    .reg-chips { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .reg-chip { padding: 4px 14px; border-radius: 20px; font-size: 13px; background: #F0F4FF; color: #3B5998; border: 1px solid #D0DDEF; }
    /* 重置公开统计面板 */
    .reset-panel { margin: 16px 0 4px; padding: 16px 18px; border: 1px dashed #E0A0A0; border-radius: 12px; background: #FFF7F7; }
    .reset-title { font-size: 15px; font-weight: 600; color: #B4453B; margin-bottom: 6px; }
    .reset-desc { font-size: 13px; color: var(--text-light); line-height: 1.6; margin-bottom: 12px; }
    .btn-danger { background: #C0392B; color: #fff; border: 1px solid #C0392B; padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; }
    .btn-danger:hover { background: #A93226; }
    /* 详情弹窗 */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 999; display: none; justify-content: center; align-items: flex-start; padding: 40px 16px; overflow-y: auto; }
    .modal-overlay.show { display: flex; }
    .modal-box { background: #fff; border-radius: 16px; max-width: 640px; width: 100%; box-shadow: 0 12px 48px rgba(0,0,0,.2); padding: 24px; margin-bottom: 40px; }
    .modal-box h3 { margin: 0 0 4px; font-size: 18px; }
    .modal-close { float: right; cursor: pointer; font-size: 22px; color: var(--text-light); line-height: 1; }
    .detail-section { margin-top: 18px; }
    .detail-section h4 { font-size: 14px; color: var(--text-light); margin: 0 0 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; font-size: 13px; }
    .detail-grid .label { color: var(--text-light); }
    .detail-table { width: 100%; font-size: 13px; border-collapse: collapse; }
    .detail-table th, .detail-table td { padding: 5px 8px; border-bottom: 1px solid #EEE; text-align: left; }
    .detail-table th { color: var(--text-light); font-weight: normal; font-size: 12px; }
    .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; }
    .badge-saved { background: #E3F2FD; color: #1565C0; }
    .badge-pending { background: #FFF3E0; color: #E65100; }
    .badge-delivered { background: #E8F5E9; color: #2E7D32; }
    .badge-cancelled { background: #FDECEA; color: #C62828; }
    .badge-signed { background: #E8F5E9; color: #2E7D32; }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="navbar" style="border-radius:12px;margin-bottom:16px;position:relative;">
      <h1>余火·留声 — 后台管理</h1>
      <span id="admin-name" style="font-size:13px;color:var(--text-light);margin-right:12px;"></span>
      <span id="admin-actions"></span>
    </div>

    <div id="login-section">
      <div class="card">
        <div class="card-title">管理员登录</div>
        <form id="admin-login-form">
          <div class="form-group">
            <label class="form-label">用户名</label>
            <input type="text" class="form-input" id="admin_username" value="admin" required>
          </div>
          <div class="form-group">
            <label class="form-label">密码</label>
            <input type="password" class="form-input" id="admin_password" value="admin123456" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block">登录</button>
        </form>
      </div>
    </div>

    <div id="admin-section" style="display:none;">
      <div class="stat-grid" id="stats"></div>

      <div id="mail-card" class="card" style="margin-bottom:12px;display:none;">
        <div class="card-title">邮件通知配置 <span id="mail-badge"></span></div>
        <div id="mail-detail" style="font-size:13px;color:var(--text-light);line-height:2;"></div>
        <div style="margin-top:10px;">
          <button class="btn btn-primary" style="padding:8px 18px;font-size:13px;" onclick="testMail()">发送测试邮件</button>
          <span id="mail-test-msg" style="margin-left:10px;font-size:13px;"></span>
        </div>
      </div>

      <div class="admin-tabs">
        <button class="active" onclick="switchTab('capsules')">胶囊管理</button>
        <button onclick="switchTab('users')">用户管理</button>
        <button onclick="switchTab('logs')">发送日志</button>
        <button onclick="switchTab('leads')">意向登记</button>
        <button id="tab-admins" onclick="switchTab('admins')" style="display:none;">账号管理</button>
        <button id="tab-action-logs" onclick="switchTab('action-logs')" style="display:none;">操作日志</button>
      </div>

      <div id="tab-content"></div>
    </div>

    <!-- 用户详情弹窗 -->
    <div class="modal-overlay" id="user-modal" onclick="if(event.target===this)closeUserModal()">
      <div class="modal-box">
        <span class="modal-close" onclick="closeUserModal()">&times;</span>
        <div id="user-modal-content"></div>
      </div>
    </div>

    <!-- 创建子管理员弹窗 -->
    <div class="modal-overlay" id="admin-create-modal" onclick="if(event.target===this)closeCreateAdmin()">
      <div class="modal-box" style="max-width:420px;">
        <span class="modal-close" onclick="closeCreateAdmin()">&times;</span>
        <h3>添加子管理员</h3>
        <p style="font-size:13px;color:var(--text-light);margin:4px 0 16px;">子管理员可登录后台查看和管理用户/胶囊，你可在操作日志中查看其所有操作。</p>
        <form id="create-admin-form" onsubmit="createAdmin(event)">
          <div class="form-group">
            <label class="form-label">用户名</label>
            <input type="text" class="form-input" id="new-admin-username" required placeholder="如：assistant01">
          </div>
          <div class="form-group">
            <label class="form-label">显示名</label>
            <input type="text" class="form-input" id="new-admin-displayname" placeholder="如：小王（选填）">
          </div>
          <div class="form-group">
            <label class="form-label">密码（至少6位）</label>
            <input type="password" class="form-input" id="new-admin-password" required minlength="6" placeholder="至少6位">
          </div>
          <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px;">创建</button>
        </form>
        <div id="create-admin-msg" style="margin-top:10px;font-size:13px;"></div>
      </div>
    </div>
  </div>

  <script src="/js/api.js?v=20260806"></script>
  <script>
    function getAdminToken() { return localStorage.getItem('adminToken') || ''; }
    function setAdminToken(t) { localStorage.setItem('adminToken', t); }
    let adminInfo = null; // { id, username, displayName, role }

    try { adminInfo = JSON.parse(localStorage.getItem('adminInfo') || 'null'); } catch(e) {}

    async function adminRequest(url, options = {}) {
      const headers = { 'Content-Type': 'application/json', ...options.headers };
      if (getAdminToken()) headers['Authorization'] = `Bearer ${getAdminToken()}`;
      const res = await fetch(`/api/admin${url}`, { ...options, headers });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '请求失败');
      return data;
    }

    function showAdminUI() {
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('admin-section').style.display = '';
      // 显示管理员名称
      const nameEl = document.getElementById('admin-name');
      if (nameEl && adminInfo) {
        nameEl.textContent = adminInfo.displayName + (adminInfo.role === 'main' ? '（主管理员）' : '（管理员）');
      }
      // 显示退出按钮
      document.getElementById('admin-actions').innerHTML = '<span class="nav-action" onclick="adminLogout()" style="cursor:pointer;">退出</span>';
      // 主管理员才显示账号管理和操作日志 Tab
      const tabAdmins = document.getElementById('tab-admins');
      const tabLogs = document.getElementById('tab-action-logs');
      if (tabAdmins) tabAdmins.style.display = adminInfo && adminInfo.role === 'main' ? '' : 'none';
      if (tabLogs) tabLogs.style.display = adminInfo && adminInfo.role === 'main' ? '' : 'none';
      loadDashboard();
    }

    if (getAdminToken() && adminInfo) {
      showAdminUI();
    }

    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('admin_username').value;
      const password = document.getElementById('admin_password').value;
      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        setAdminToken(data.token);
        if (data.adminInfo) {
          adminInfo = data.adminInfo;
          localStorage.setItem('adminInfo', JSON.stringify(adminInfo));
        }
        showAdminUI();
      } catch (err) {
        showToast(err.message);
      }
    });

    window.adminLogout = function() {
      localStorage.removeItem('adminToken');
      localStorage.removeItem('adminInfo');
      location.reload();
    };

    let currentTab = 'capsules';
    let currentPage = 1;

    async function loadDashboard() {
      try {
        const data = await adminRequest('/dashboard');
        const s = data.stats;
        document.getElementById('stats').innerHTML = `
          <div class="stat-card"><div class="stat-num">${s.totalUsers}</div><div class="stat-label">总用户</div></div>
          <div class="stat-card"><div class="stat-num">${s.totalCapsules}</div><div class="stat-label">总胶囊</div></div>
          <div class="stat-card"><div class="stat-num">${s.pendingCapsules}</div><div class="stat-label">待发送</div></div>
          <div class="stat-card"><div class="stat-num">${s.deliveredCapsules}</div><div class="stat-label">已送达</div></div>
          <div class="stat-card"><div class="stat-num">${s.successLogs}</div><div class="stat-label">成功发送</div></div>
          <div class="stat-card"><div class="stat-num">${s.totalLogs}</div><div class="stat-label">总发送记录</div></div>
          <div class="stat-card"><div class="stat-num">${s.totalLeads}</div><div class="stat-label">意向登记</div></div>
        `;
        // 注册统计标签
        let regHtml = '<div class="reg-chips">';
        regHtml += `<span class="reg-chip">今日注册 ${s.todayUsers}</span>`;
        regHtml += `<span class="reg-chip">近7天 ${s.weekUsers}</span>`;
        regHtml += `<span class="reg-chip">近30天 ${s.monthUsers}</span>`;
        regHtml += '</div>';
        const oldReg = document.getElementById('reg-stats');
        if (oldReg) oldReg.remove();
        const regDiv = document.createElement('div');
        regDiv.id = 'reg-stats';
        regDiv.innerHTML = regHtml;
        document.getElementById('stats').after(regDiv);

        // 重置公开统计面板（仅主账号可见）
        const oldReset = document.getElementById('reset-stats');
        if (oldReset) oldReset.remove();
        if (adminInfo && adminInfo.role === 'main') {
          const resetDiv = document.createElement('div');
          resetDiv.id = 'reset-stats';
          resetDiv.className = 'reset-panel';
          resetDiv.innerHTML = `
            <div class="reset-title">公开统计数据</div>
            <div class="reset-desc">以下数据用于首页"实时数据 / 生长之树"展示。若想从现在开始重新累计真实数据（清空开发期测试记录），可一键清零。此操作不影响真实用户、胶囊、合同与投递记录。</div>
            <button class="btn btn-danger" onclick="resetPublicStats()">清零公开统计（访问 / 登记 / 赞赏）</button>
          `;
          regDiv.after(resetDiv);
        }
        loadTab();
        loadMailStatus();
      } catch (err) {
        showToast(err.message);
      }
    }

    window.switchTab = function(tab) {
      currentTab = tab;
      currentPage = 1;
      document.querySelectorAll('.admin-tabs button').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      loadTab();
    };

    async function loadTab() {
      const content = document.getElementById('tab-content');
      content.innerHTML = '<p style="text-align:center;color:var(--text-light);">加载中...</p>';

      try {
        if (currentTab === 'capsules') {
          const data = await adminRequest(`/capsules?page=${currentPage}`);
          let html = '<div class="table-wrapper"><table class="admin-table"><thead><tr><th>ID</th><th>标题</th><th>用户</th><th>收件人</th><th>类型</th><th>状态</th><th>触发方式</th><th>操作</th></tr></thead><tbody>';
          for (const c of data.capsules) {
            const trigger = c.trigger_type === 'immediate' ? '立即' : c.trigger_type === 'scheduled' ? (c.trigger_date ? new Date(c.trigger_date).toLocaleString('zh-CN').slice(5,16) : '未设置') : '手动';
            html += `<tr>
              <td>${c.id}</td>
              <td>${c.title}</td>
              <td>${c.user_name || c.user_phone}</td>
              <td>${c.recipient_name}<br><span style="font-size:11px;color:var(--text-light);">${c.recipient_email}</span></td>
              <td>${TYPE_MAP[c.content_type] || c.content_type}</td>
              <td>${statusTag(c.status)}</td>
              <td style="font-size:12px;">${trigger}</td>
              <td>${c.status !== 'delivered' && c.status !== 'cancelled' ? `<button class="btn btn-primary" style="padding:4px 10px;font-size:12px;" onclick="adminTrigger(${c.id})">触发</button>` : '-'}</td>
            </tr>`;
          }
          html += '</tbody></table></div>';
          html += renderPagination(data.totalPages, data.page);
          content.innerHTML = html;
        } else if (currentTab === 'users') {
          let html = '<div class="admin-toolbar">';
          html += '<input type="text" id="user-search-input" placeholder="搜索手机号 / 姓名 / 邮箱" onkeydown="if(event.key===\'Enter\')searchUsers()">';
          html += '<button class="btn btn-primary" style="padding:8px 16px;font-size:13px;" onclick="searchUsers()">搜索</button>';
          html += '<button class="btn" style="padding:8px 16px;font-size:13px;border:1px solid var(--border);" onclick="downloadUsers()">导出CSV</button>';
          html += '<button class="btn" style="padding:8px 16px;font-size:13px;border:1px solid var(--border);background:#E8F5E9;color:#2E7D32;" onclick="downloadUsersExcel()">导出Excel</button>';
          html += '</div>';
          const searchVal = document.getElementById('user-search-input') ? document.getElementById('user-search-input').value : '';
          const data = await adminRequest(`/users?page=${currentPage}&search=${encodeURIComponent(searchVal)}`);
          html += '<div class="table-wrapper"><table class="admin-table"><thead><tr><th>ID</th><th>手机号</th><th>姓名</th><th>邮箱</th><th>胶囊数</th><th>紧急联系人</th><th>注册时间</th></tr></thead><tbody>';
          for (const u of data.users) {
            html += `<tr onclick="showUserDetail(${u.id})">
              <td>${u.id}</td>
              <td>${u.phone}</td>
              <td>${u.name || '-'}</td>
              <td>${u.email || '-'}</td>
              <td style="text-align:center;font-weight:600;color:var(--primary);">${u.capsule_count || 0}</td>
              <td>${u.emergency_contact || '-'} ${u.emergency_phone || ''}</td>
              <td style="font-size:12px;">${new Date(u.created_at).toLocaleString('zh-CN')}</td>
            </tr>`;
          }
          html += '</tbody></table></div>';
          html += renderPagination(data.totalPages, data.page);
          content.innerHTML = html;
        } else if (currentTab === 'logs') {
          const data = await adminRequest(`/logs?page=${currentPage}`);
          let html = '<div class="table-wrapper"><table class="admin-table"><thead><tr><th>ID</th><th>胶囊</th><th>方式</th><th>收件人</th><th>状态</th><th>操作人</th><th>时间</th><th>错误</th></tr></thead><tbody>';
          for (const l of data.logs) {
            html += `<tr>
              <td>${l.id}</td>
              <td>${l.capsule_title || '#' + l.capsule_id}</td>
              <td>${l.send_method}</td>
              <td>${l.recipient}</td>
              <td>${statusTag(l.status)}</td>
              <td>${l.operator}</td>
              <td style="font-size:12px;">${l.sent_at ? new Date(l.sent_at).toLocaleString('zh-CN') : '-'}</td>
              <td style="font-size:11px;color:var(--danger);">${l.error_message || '-'}</td>
            </tr>`;
          }
          html += '</tbody></table></div>';
          html += renderPagination(data.totalPages, data.page);
          content.innerHTML = html;
        } else if (currentTab === 'leads') {
          const data = await adminRequest(`/leads`);
          let html = '<div style="margin-bottom:12px;"><button class="btn btn-primary" onclick="downloadLeads()">导出 CSV</button></div>';
          html += '<div class="table-wrapper"><table class="admin-table"><thead><tr><th>ID</th><th>称呼</th><th>手机号</th><th>邮箱</th><th>意向内容</th><th>早期</th><th>留言</th><th>登记时间</th></tr></thead><tbody>';
          for (const l of data.leads) {
            html += `<tr>
              <td>${l.id}</td>
              <td>${l.name || '-'}</td>
              <td>${l.phone || '-'}</td>
              <td>${l.email || '-'}</td>
              <td style="font-size:12px;">${l.content_types || '-'}</td>
              <td>${l.want_early ? '是' : '否'}</td>
              <td style="font-size:12px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${l.message || ''}">${l.message || '-'}</td>
              <td style="font-size:12px;">${new Date(l.created_at).toLocaleString('zh-CN')}</td>
            </tr>`;
          }
          html += '</tbody></table></div>';
          content.innerHTML = html;
        } else if (currentTab === 'admins') {
          // 账号管理（仅主管理员）
          const data = await adminRequest('/admins');
          let html = '<div style="margin-bottom:16px;">';
          html += '<button class="btn btn-primary" style="padding:8px 18px;font-size:14px;" onclick="showCreateAdminForm()">+ 添加子管理员</button>';
          html += '</div>';
          html += '<div class="table-wrapper"><table class="admin-table"><thead><tr><th>ID</th><th>用户名</th><th>显示名</th><th>角色</th><th>状态</th><th>操作数</th><th>最后操作</th><th>创建时间</th><th>操作</th></tr></thead><tbody>';
          for (const a of data.admins) {
            const roleBadge = a.role === 'main'
              ? '<span class="badge" style="background:#E3F2FD;color:#1565C0;">主管理员</span>'
              : '<span class="badge" style="background:#FFF3E0;color:#E65100;">子管理员</span>';
            const statusBadge = a.is_active
              ? '<span class="badge badge-signed">启用</span>'
              : '<span class="badge badge-cancelled">停用</span>';
            const actions = a.role === 'main' ? '-' :
              `<button class="btn" style="padding:4px 10px;font-size:12px;border:1px solid var(--border);" onclick="toggleAdmin(${a.id})">${a.is_active ? '停用' : '启用'}</button> ` +
              `<button class="btn" style="padding:4px 10px;font-size:12px;color:#C62828;border:1px solid #F5C6CB;" onclick="deleteAdmin(${a.id}, '${a.username}')">删除</button>`;
            html += `<tr>
              <td>${a.id}</td>
              <td>${a.username}</td>
              <td>${a.display_name || a.username}</td>
              <td>${roleBadge}</td>
              <td>${statusBadge}</td>
              <td style="text-align:center;">${a.action_count || 0}</td>
              <td style="font-size:12px;">${a.last_action_at ? new Date(a.last_action_at).toLocaleString('zh-CN') : '-'}</td>
              <td style="font-size:12px;">${new Date(a.created_at).toLocaleString('zh-CN')}</td>
              <td>${actions}</td>
            </tr>`;
          }
          html += '</tbody></table></div>';
          content.innerHTML = html;
        } else if (currentTab === 'action-logs') {
          // 操作日志（仅主管理员）
          const data = await adminRequest(`/admin-logs?page=${currentPage}`);
          const ACTION_LABELS = {
            'login': '登录', 'trigger_capsule': '触发胶囊', 'export_csv': '导出CSV',
            'export_excel': '导出Excel', 'create_admin': '创建管理员', 'delete_admin': '删除管理员',
            'toggle_admin': '启用/停用',
          };
          let html = '<div class="table-wrapper"><table class="admin-table"><thead><tr><th>ID</th><th>操作人</th><th>动作</th><th>对象</th><th>详情</th><th>IP</th><th>时间</th></tr></thead><tbody>';
          for (const l of data.logs) {
            html += `<tr>
              <td>${l.id}</td>
              <td>${l.admin_name}</td>
              <td><span class="badge" style="background:#F0F4FF;color:#3B5998;">${ACTION_LABELS[l.action] || l.action}</span></td>
              <td style="font-size:12px;">${l.target || '-'}</td>
              <td style="font-size:12px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${l.detail || ''}">${l.detail || '-'}</td>
              <td style="font-size:11px;">${l.ip || '-'}</td>
              <td style="font-size:12px;">${new Date(l.created_at).toLocaleString('zh-CN')}</td>
            </tr>`;
          }
          html += '</tbody></table></div>';
          html += renderPagination(data.totalPages, data.page);
          content.innerHTML = html;
        }
      } catch (err) {
        content.innerHTML = `<p style="text-align:center;color:var(--danger);">${err.message}</p>`;
      }
    }

    async function loadMailStatus() {
      try {
        const s = await adminRequest('/mail-status');
        const card = document.getElementById('mail-card');
        const badge = document.getElementById('mail-badge');
        const detail = document.getElementById('mail-detail');
        card.style.display = '';
        if (s.configured) {
          badge.textContent = '已配置';
          badge.style.background = '#E8F5E9'; badge.style.color = '#388E3C';
        } else {
          badge.textContent = '未配置';
          badge.style.background = '#FDECEA'; badge.style.color = '#D32F2F';
        }
        badge.style.padding = '2px 10px'; badge.style.borderRadius = '12px'; badge.style.fontSize = '12px'; badge.style.marginLeft = '6px';
        detail.innerHTML = `服务类型：${s.service}<br>发件邮箱：${s.user}<br>通知邮箱：${s.workMail}` +
          (s.configured ? '' : '<br><span style="color:#D32F2F;">⚠️ 当前邮件未配置，有人登记意向你将收不到通知。请检查服务器 .env.prod 的 MAIL_SERVICE / SMTP_* 配置后重启容器。</span>');
      } catch (e) { /* ignore */ }
    }

    window.testMail = async function() {
      const msg = document.getElementById('mail-test-msg');
      msg.textContent = '发送中…'; msg.style.color = 'var(--text-light)';
      try {
        const r = await adminRequest('/mail-test', { method: 'POST' });
        if (r.ok) { msg.textContent = '✅ ' + r.message; msg.style.color = '#388E3C'; }
        else { msg.textContent = '❌ ' + (r.error || '发送失败'); msg.style.color = '#D32F2F'; }
      } catch (e) { msg.textContent = '❌ ' + e.message; msg.style.color = '#D32F2F'; }
      loadMailStatus();
    };

    function renderPagination(totalPages, page) {
      if (totalPages <= 1) return '';
      let html = '<div class="pagination">';
      html += `<button ${page <= 1 ? 'disabled' : ''} onclick="goPage(${page - 1})">上一页</button>`;
      html += `<span style="padding:6px 14px;font-size:13px;">${page} / ${totalPages}</span>`;
      html += `<button ${page >= totalPages ? 'disabled' : ''} onclick="goPage(${page + 1})">下一页</button>`;
      html += '</div>';
      return html;
    }

    window.goPage = function(p) { currentPage = p; loadTab(); };

    window.adminTrigger = async function(id) {
      if (!confirm(`确定要后台触发胶囊 #${id} 的发送吗？`)) return;
      try {
        const data = await adminRequest(`/capsules/${id}/trigger`, { method: 'POST' });
        showToast(data.message);
        if (data.previewUrl) {
          setTimeout(() => window.open(data.previewUrl, '_blank'), 1500);
        }
        loadDashboard();
      } catch (err) {
        showToast(err.message);
      }
    };

    window.downloadLeads = async function() {
      try {
        const res = await fetch('/api/admin/leads/export', {
          headers: { 'Authorization': `Bearer ${getAdminToken()}` },
        });
        if (!res.ok) throw new Error('导出失败');
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'leads-export.csv';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      } catch (err) {
        showToast(err.message);
      }
    };

    // === 用户管理增强 ===
    window.searchUsers = function() {
      currentPage = 1;
      loadTab();
    };

    window.resetPublicStats = async function() {
      if (!confirm('确定要清零公开统计吗？\n\n将清空：累计访问、意向登记、赞赏记录。\n真实用户、胶囊、合同、投递记录不受影响。\n\n此操作会从此刻起重新累计真实数据。')) {
        return;
      }
      try {
        const data = await adminRequest('/reset-public-stats', { method: 'POST' });
        showToast(data.message || '已重置');
        loadDashboard();
      } catch (err) {
        showToast(err.message);
      }
    };

    window.showUserDetail = async function(id) {
      const modal = document.getElementById('user-modal');
      const content = document.getElementById('user-modal-content');
      content.innerHTML = '<p style="text-align:center;color:var(--text-light);padding:20px;">加载中...</p>';
      modal.classList.add('show');
      try {
        const data = await adminRequest(`/users/${id}`);
        const u = data.user;
        let html = `<h3>${u.name || u.phone}</h3>`;
        html += `<p style="font-size:13px;color:var(--text-light);">用户 #${u.id} · 注册于 ${new Date(u.created_at).toLocaleString('zh-CN')}</p>`;
        // 基本信息
        html += '<div class="detail-section"><h4>基本信息</h4><div class="detail-grid">';
        html += `<div><span class="label">手机号</span></div><div>${u.phone}</div>`;
        html += `<div><span class="label">邮箱</span></div><div>${u.email || '-'}</div>`;
        html += `<div><span class="label">紧急联系人</span></div><div>${u.emergency_contact || '-'}</div>`;
        html += `<div><span class="label">紧急联系电话</span></div><div>${u.emergency_phone || '-'}</div>`;
        html += `<div><span class="label">更新时间</span></div><div>${u.updated_at ? new Date(u.updated_at).toLocaleString('zh-CN') : '-'}</div>`;
        html += '</div></div>';
        // 胶囊列表
        html += '<div class="detail-section"><h4>胶囊 (' + data.capsules.length + ')</h4>';
        if (data.capsules.length === 0) {
          html += '<p style="font-size:13px;color:var(--text-light);">暂无胶囊</p>';
        } else {
          html += '<table class="detail-table"><thead><tr><th>标题</th><th>类型</th><th>状态</th><th>触发</th><th>创建时间</th></tr></thead><tbody>';
          for (const c of data.capsules) {
            const trigger = c.trigger_type === 'immediate' ? '立即' : c.trigger_type === 'scheduled' ? (c.trigger_date ? new Date(c.trigger_date).toLocaleDateString('zh-CN') : '未设置') : '手动';
            html += `<tr>
              <td>${c.title}</td>
              <td>${TYPE_MAP[c.content_type] || c.content_type}</td>
              <td>${statusTag(c.status)}</td>
              <td style="font-size:12px;">${trigger}</td>
              <td style="font-size:12px;">${new Date(c.created_at).toLocaleDateString('zh-CN')}</td>
            </tr>`;
          }
          html += '</tbody></table>';
        }
        html += '</div>';
        // 合同
        if (data.contracts && data.contracts.length > 0) {
          html += '<div class="detail-section"><h4>合同 (' + data.contracts.length + ')</h4>';
          html += '<table class="detail-table"><thead><tr><th>合同编号</th><th>类型</th><th>状态</th><th>签署时间</th></tr></thead><tbody>';
          for (const ct of data.contracts) {
            html += `<tr>
              <td style="font-size:12px;">${ct.contract_no}</td>
              <td>${ct.contract_type}</td>
              <td>${statusTag(ct.status)}</td>
              <td style="font-size:12px;">${ct.signed_at ? new Date(ct.signed_at).toLocaleString('zh-CN') : '-'}</td>
            </tr>`;
          }
          html += '</tbody></table></div>';
        }
        // 投递日志
        html += '<div class="detail-section"><h4>投递日志 (' + data.logs.length + ')</h4>';
        if (data.logs.length === 0) {
          html += '<p style="font-size:13px;color:var(--text-light);">暂无投递记录</p>';
        } else {
          html += '<table class="detail-table"><thead><tr><th>胶囊</th><th>方式</th><th>收件人</th><th>状态</th><th>操作人</th><th>时间</th></tr></thead><tbody>';
          for (const l of data.logs) {
            html += `<tr>
              <td>${l.capsule_title || '#' + l.capsule_id}</td>
              <td>${l.send_method}</td>
              <td style="font-size:12px;">${l.recipient}</td>
              <td>${statusTag(l.status)}</td>
              <td style="font-size:12px;">${l.operator}</td>
              <td style="font-size:12px;">${l.sent_at ? new Date(l.sent_at).toLocaleString('zh-CN') : '-'}</td>
            </tr>`;
          }
          html += '</tbody></table>';
        }
        html += '</div>';
        content.innerHTML = html;
      } catch (err) {
        content.innerHTML = `<p style="color:var(--danger);">${err.message}</p>`;
      }
    };

    // === 子管理员管理 ===
    window.showCreateAdminForm = function() {
      document.getElementById('admin-create-modal').classList.add('show');
      document.getElementById('create-admin-msg').textContent = '';
    };
    window.closeCreateAdmin = function() {
      document.getElementById('admin-create-modal').classList.remove('show');
    };
    window.createAdmin = async function(e) {
      e.preventDefault();
      const username = document.getElementById('new-admin-username').value.trim();
      const displayName = document.getElementById('new-admin-displayname').value.trim();
      const password = document.getElementById('new-admin-password').value;
      const msg = document.getElementById('create-admin-msg');
      msg.textContent = '创建中...'; msg.style.color = 'var(--text-light)';
      try {
        const data = await adminRequest('/admins', {
          method: 'POST',
          body: JSON.stringify({ username, password, display_name: displayName }),
        });
        msg.textContent = '✅ ' + data.message; msg.style.color = '#388E3C';
        setTimeout(() => { closeCreateAdmin(); loadTab(); }, 1000);
      } catch (err) {
        msg.textContent = '❌ ' + err.message; msg.style.color = '#D32F2F';
      }
    };
    window.toggleAdmin = async function(id) {
      if (!confirm('确定要切换该账号的状态吗？')) return;
      try {
        const data = await adminRequest(`/admins/${id}/toggle`, { method: 'PUT' });
        showToast(data.message);
        loadTab();
      } catch (err) {
        showToast(err.message);
      }
    };
    window.deleteAdmin = async function(id, username) {
      if (!confirm(`确定要删除子管理员 "${username}" 吗？此操作不可恢复。`)) return;
      try {
        const data = await adminRequest(`/admins/${id}`, { method: 'DELETE' });
        showToast(data.message);
        loadTab();
      } catch (err) {
        showToast(err.message);
      }
    };
  </script>
