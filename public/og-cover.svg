      <stop offset="0%" stop-color="#070912"/>
      <stop offset="48%" stop-color="#0b0d18"/>
      <stop offset="100%" stop-color="#150d08"/>
    </linearGradient>
    <radialGradient id="flame" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#ffe9c7"/>
      <stop offset="45%" stop-color="#f0b35a"/>
      <stop offset="100%" stop-color="#d98335"/>
    </radialGradient>
    <radialGradient id="glowc" cx="50%" cy="34%" r="55%">
      <stop offset="0%" stop-color="rgba(255,150,60,0.30)"/>
      <stop offset="100%" stop-color="rgba(255,150,60,0)"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
