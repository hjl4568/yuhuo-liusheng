    <path d="M60 60 C 84 90, 104 108, 90 142 C 80 172, 60 180, 60 180 C 60 180, 40 172, 30 142 C 16 108, 36 90, 60 60 Z" fill="#fff4e2" opacity="0.9"/>
  </g>
  <text x="600" y="470" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="92" font-weight="700" fill="#ffd7a0" letter-spacing="14">长夜余火</text>
  <text x="600" y="528" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" fill="#b3a78d" letter-spacing="8">让此刻的声音，抵达未来</text>
  <text x="600" y="575" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#857c6a" letter-spacing="4">余火 · 留声 ｜ 表达与交还，把话说给未来</text>
