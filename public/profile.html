<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>个人中心 — 余火·留声</title>
  <link rel="stylesheet" href="/css/style.css?v=20260806">
  <style>
    .dash-card{margin-bottom:16px;}
    .dash-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px;}
    .dash-tile{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px;text-align:center;}
    .dash-tile .n{font-size:24px;font-weight:700;color:var(--primary-strong);line-height:1.1;}
    .dash-tile .l{font-size:12px;color:var(--text-light);margin-top:4px;}
    .dash-sub{font-size:14px;font-weight:600;margin:16px 0 10px;color:var(--secondary);}
    .dash-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px;}
    .dash-bar-label{width:92px;flex:0 0 auto;color:var(--text-light);}
    .dash-bar-track{flex:1;height:10px;background:rgba(255,255,255,.06);border-radius:6px;overflow:hidden;}
    .dash-bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#d4af37,#b8860b);}
    .dash-bar-val{width:30px;text-align:right;color:var(--text-light);}
    .dash-act{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px;}
    .dash-act:last-child{border-bottom:none;}
    .dash-act .t{color:var(--secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:62%;}
    .dash-act .m{color:var(--text-light);font-size:12px;flex:0 0 auto;}
    @media (max-width:480px){.dash-tile .n{font-size:20px;}}
  </style>
</head>
<body>
  <div class="app-container">
    <div class="navbar">
      <h1>个人中心</h1>
      <span style="width:40px;"></span>
    </div>

    <div class="page" id="profile-page">
      <div class="empty-state"><div class="empty-icon">⏳</div><p>加载中...</p></div>
    </div>

    <div class="page" id="dashboard-page">
      <div class="empty-state"><div class="empty-icon">⏳</div><p>加载中...</p></div>
    </div>

    <div class="bottom-nav">
      <a href="/app.html"><span class="nav-icon">🏠</span>首页</a>
      <a href="/create.html"><span class="nav-icon">✏️</span>创建</a>
      <a href="/capsules.html"><span class="nav-icon">📦</span>我的</a>
      <a href="/profile.html" class="active"><span class="nav-icon">👤</span>我的</a>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    if (!requireAuth()) throw new Error('redirect');

    async function loadProfile() {
      try {
        const data = await request('/auth/profile');
        const u = data.user;
        document.getElementById('profile-page').innerHTML = `
          <div class="card" style="text-align:center;">
            <div style="width:64px;height:64px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 12px;">
              ${u.name ? u.name[0] : '👤'}
            </div>
            <h2 style="font-size:20px;margin-bottom:4px;">${u.name || '未设置姓名'}</h2>
            <p style="font-size:14px;color:var(--text-light);">${u.phone}</p>
          </div>

          <div class="card">
            <div class="card-title">个人信息</div>
            <form id="profile-form">
              <div class="form-group">
                <label class="form-label">姓名</label>
                <input type="text" class="form-input" id="name" value="${u.name || ''}">
              </div>
              <div class="form-group">
                <label class="form-label">邮箱</label>
                <input type="email" class="form-input" id="email" value="${u.email || ''}">
              </div>
              <div class="form-group">
                <label class="form-label">紧急联系人</label>
                <input type="text" class="form-input" id="emergency_contact" value="${u.emergency_contact || ''}" placeholder="用于触发通知">
              </div>
              <div class="form-group">
                <label class="form-label">紧急联系人电话</label>
                <input type="tel" class="form-input" id="emergency_phone" value="${u.emergency_phone || ''}">
              </div>
              <button type="submit" class="btn btn-primary btn-block">保存修改</button>
            </form>
          </div>

          <div class="card" id="contract-entry">
            <div class="card-title">电子合同</div>
            <div id="contract-status"><p style="font-size:14px;color:var(--text-light);">加载中...</p></div>
          </div>

          <div class="card">
            <button class="btn btn-danger btn-block" onclick="logout()">退出登录</button>
          </div>
        `;

        loadContractEntry();

        document.getElementById('profile-form').addEventListener('submit', async (e) => {
          e.preventDefault();
          try {
            await request('/auth/profile', {
              method: 'PUT',
              body: JSON.stringify({
                name: document.getElementById('name').value.trim(),
                email: document.getElementById('email').value.trim(),
                emergency_contact: document.getElementById('emergency_contact').value.trim(),
                emergency_phone: document.getElementById('emergency_phone').value.trim(),
              }),
            });
            showToast('保存成功');
          } catch (err) {
            showToast(err.message);
          }
        });
      } catch (err) {
        document.getElementById('profile-page').innerHTML = `<p style="text-align:center;color:var(--danger);">${err.message}</p>`;
      }
    }

    async function loadContractEntry() {
      const box = document.getElementById('contract-status');
      if (!box) return;
      try {
        const data = await request('/contracts');
        if (data.contracts && data.contracts.length) {
          const c = data.contracts[0];
          box.innerHTML = `
            <p style="font-size:14px;color:var(--success);margin-bottom:8px;">✓ 您已签署服务协议</p>
            <p style="font-size:13px;color:var(--text-light);margin-bottom:10px;">编号 ${c.contract_no}</p>
            <a class="btn btn-outline btn-block" href="/contract.html">查看 / 管理合同</a>
          `;
        } else {
          box.innerHTML = `
            <p style="font-size:14px;color:var(--text-light);margin-bottom:10px;">您尚未签署《数字遗产托管及内容授权服务协议》</p>
            <a class="btn btn-primary btn-block" href="/contract.html">去签署电子合同</a>
          `;
        }
      } catch (e) {
        box.innerHTML = `<a class="btn btn-outline btn-block" href="/contract.html">电子合同</a>`;
      }
    }

    window.logout = function() {
      if (!confirm('确定退出登录？')) return;
      clearToken();
      window.location.href = '/app.html';
    };

    async function loadDashboard() {
      const box = document.getElementById('dashboard-page');
      try {
        const s = await request('/stats/me');
        const byStatus = s.byStatus || {};
        const byType = s.byType || {};
        const total = s.total || 0;

        const tiles = `
          <div class="dash-grid">
            <div class="dash-tile"><div class="n">${total}</div><div class="l">我的胶囊</div></div>
            <div class="dash-tile"><div class="n">${s.delivered || 0}</div><div class="l">已送达</div></div>
            <div class="dash-tile"><div class="n">${ (byStatus.pending || 0) + (byStatus.triggered || 0) }</div><div class="l">等待触发</div></div>
            <div class="dash-tile"><div class="n">${ byStatus.saved || 0 }</div><div class="l">已保存</div></div>
          </div>`;

        const statusDefs = [['saved', '已保存'], ['pending', '等待触发'], ['delivered', '已送达'], ['cancelled', '已取消']];
        const maxStatus = Math.max(1, ...statusDefs.map(function (d) { return byStatus[d[0]] || 0; }));
        const statusBars = statusDefs.map(function (d) {
          const v = byStatus[d[0]] || 0;
          const pct = Math.round(v / maxStatus * 100);
          return '<div class="dash-bar-row"><div class="dash-bar-label">' + d[1] + '</div><div class="dash-bar-track"><div class="dash-bar-fill" style="width:' + pct + '%;"></div></div><div class="dash-bar-val">' + v + '</div></div>';
        }).join('');

        const typeDefs = [['text', '文字'], ['audio', '录音'], ['video', '影像/视频'], ['physical', '实物/纸质'], ['image', '图片']];
        const maxType = Math.max(1, ...Object.keys(byType).map(function (k) { return byType[k] || 0; }));
        const typeBars = typeDefs.filter(function (d) { return byType[d[0]]; }).map(function (d) {
          const v = byType[d[0]] || 0;
          const pct = Math.round(v / maxType * 100);
          return '<div class="dash-bar-row"><div class="dash-bar-label">' + d[1] + '</div><div class="dash-bar-track"><div class="dash-bar-fill" style="width:' + pct + '%;"></div></div><div class="dash-bar-val">' + v + '</div></div>';
        }).join('');
        const typeBlock = typeBars || '<p style="font-size:13px;color:var(--text-light);">暂无数据</p>';

        const recent = (s.recent || []).map(function (r) {
          return '<div class="dash-act"><span class="t">' + r.title + '</span><span class="m">' + statusTag(r.status) + ' ' + new Date(r.created_at).toLocaleDateString('zh-CN') + '</span></div>';
        }).join('');
        const recentBlock = recent || '<p style="font-size:13px;color:var(--text-light);">暂无胶囊，去创建一个吧</p>';

        box.innerHTML = `
          <div class="card dash-card">
            <div class="card-title">数据仪表盘</div>
            ${tiles}
            <div class="dash-sub">状态分布</div>
            ${statusBars}
            <div class="dash-sub">内容类型分布</div>
            ${typeBlock}
            <div class="dash-sub">近期动态</div>
            ${recentBlock}
          </div>`;
      } catch (err) {
        box.innerHTML = '<p style="text-align:center;color:var(--danger);">' + err.message + '</p>';
      }
    }

    loadProfile();
    loadDashboard();
  </script>
  <script src="/js/i18n-data.js?v=20260806"></script>
  <script src="/js/i18n.js?v=20260806"></script>
</body>
</html>
